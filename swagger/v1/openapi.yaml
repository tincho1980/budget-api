---
openapi: 3.0.3
info:
  title: adavra-sales — API del portal de clientes
  version: v1
  description: |
    API que usa el portal de clientes. Cada cliente ve solo sus propios proyectos,
    presupuestos, cuotas y pagos: un recurso de otro cliente responde **404**.

    **Autenticación:** `POST /login` devuelve un token. Se envía en cada pedido como
    `Authorization: Bearer <token>`. `DELETE /logout` lo invalida. Solo los usuarios
    con rol cliente tienen acceso.

    **Errores:** siempre con la forma `{ "error": { "status", "message", "details" } }`.

    **Montos y horas:** strings con dos decimales (`"380000.00"`).
servers:
- url: https://adavra-sales.onrender.com/api/v1
  description: Producción (Render)
- url: http://localhost:3000/api/v1
  description: Desarrollo
tags:
- name: Sesión
  description: Login y logout del portal
- name: Proyectos
- name: Presupuestos
  description: Consulta, aprobación y rechazo
- name: Cuenta
  description: Deuda y cuotas de mantenimiento
- name: Pagos
  description: Pagos informados por el cliente
paths:
  "/account":
    get:
      summary: Ver el estado de cuenta
      tags:
      - Cuenta
      description: Deuda total, cuotas impagas (de la más vieja a la más nueva) y
        los últimos 5 pagos.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer <token>
        schema:
          type: string
      responses:
        '401':
          description: Token inválido o ausente
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '200':
          description: Estado de cuenta del cliente
          content:
            application/json:
              schema:
                type: object
                required:
                - account
                additionalProperties: false
                properties:
                  account:
                    "$ref": "#/components/schemas/account"
  "/charges":
    get:
      summary: Listar las cuotas de mantenimiento
      tags:
      - Cuenta
      description: De la más nueva a la más vieja. Se pueden filtrar por estado.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer <token>
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - pending
          - partial
          - paid
          - overdue
      responses:
        '401':
          description: Token inválido o ausente
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '200':
          description: Cuotas del cliente
          content:
            application/json:
              schema:
                type: object
                required:
                - charges
                additionalProperties: false
                properties:
                  charges:
                    type: array
                    items:
                      "$ref": "#/components/schemas/charge"
        '400':
          description: Estado inválido
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/budgets/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: Ver un presupuesto
      tags:
      - Presupuestos
      description: Los borradores no son visibles para el cliente y responden 404.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer <token>
        schema:
          type: string
      responses:
        '401':
          description: Token inválido o ausente
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '200':
          description: Presupuesto agrupado por módulo
          content:
            application/json:
              schema:
                type: object
                required:
                - budget
                additionalProperties: false
                properties:
                  budget:
                    "$ref": "#/components/schemas/budget"
        '404':
          description: Borrador, inexistente o de otro cliente
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/budgets/{id}/approve":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    post:
      summary: Aprobar un presupuesto
      tags:
      - Presupuestos
      description: Solo se puede decidir sobre un presupuesto enviado (status sent).
        Avisa por mail a los administradores.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer <token>
        schema:
          type: string
      responses:
        '401':
          description: Token inválido o ausente
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '200':
          description: Presupuesto aprobado
          content:
            application/json:
              schema:
                type: object
                required:
                - budget
                additionalProperties: false
                properties:
                  budget:
                    "$ref": "#/components/schemas/budget"
        '422':
          description: El presupuesto ya fue decidido
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '404':
          description: Borrador, inexistente o de otro cliente
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/budgets/{id}/reject":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    post:
      summary: Rechazar un presupuesto
      tags:
      - Presupuestos
      description: Solo se puede decidir sobre un presupuesto enviado (status sent).
        Avisa por mail a los administradores.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer <token>
        schema:
          type: string
      responses:
        '401':
          description: Token inválido o ausente
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '200':
          description: Presupuesto rechazado
          content:
            application/json:
              schema:
                type: object
                required:
                - budget
                additionalProperties: false
                properties:
                  budget:
                    "$ref": "#/components/schemas/budget"
        '422':
          description: El presupuesto ya fue decidido
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/payments":
    get:
      summary: Listar los pagos informados
      tags:
      - Pagos
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer <token>
        schema:
          type: string
      responses:
        '401':
          description: Token inválido o ausente
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '200':
          description: Pagos del cliente, del más reciente al más viejo
          content:
            application/json:
              schema:
                type: object
                required:
                - payments
                additionalProperties: false
                properties:
                  payments:
                    type: array
                    items:
                      "$ref": "#/components/schemas/payment"
    post:
      summary: Informar un pago
      tags:
      - Pagos
      description: |
        El pago queda en `pending_review` y no se aplica a ninguna cuota hasta que un
        administrador lo confirma en el back-office.

        Se puede enviar como JSON (sin comprobante) o como `multipart/form-data` con el
        comprobante en `receipt`: PDF, JPG o PNG de hasta 5 MB.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer <token>
        schema:
          type: string
      responses:
        '401':
          description: Token inválido o ausente
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '201':
          description: Pago informado
          content:
            application/json:
              schema:
                type: object
                required:
                - payment
                additionalProperties: false
                properties:
                  payment:
                    "$ref": "#/components/schemas/payment"
        '422':
          description: Datos inválidos o comprobante no permitido
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/payment_request"
          multipart/form-data:
            schema:
              "$ref": "#/components/schemas/payment_request"
  "/projects":
    get:
      summary: Listar los proyectos del cliente
      tags:
      - Proyectos
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer <token>
        schema:
          type: string
      responses:
        '401':
          description: Token inválido o ausente
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '200':
          description: Proyectos ordenados por nombre
          content:
            application/json:
              schema:
                type: object
                required:
                - projects
                additionalProperties: false
                properties:
                  projects:
                    type: array
                    items:
                      "$ref": "#/components/schemas/project"
  "/projects/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: Ver un proyecto con sus presupuestos
      tags:
      - Proyectos
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer <token>
        schema:
          type: string
      responses:
        '401':
          description: Token inválido o ausente
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '200':
          description: Proyecto con los presupuestos enviados al cliente
          content:
            application/json:
              schema:
                type: object
                required:
                - project
                additionalProperties: false
                properties:
                  project:
                    "$ref": "#/components/schemas/project_detail"
        '404':
          description: No existe o es de otro cliente
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/login":
    post:
      summary: Iniciar sesión
      tags:
      - Sesión
      description: 'Devuelve el token del cliente. Cada login genera un token nuevo
        e invalida el anterior. Límite: 10 intentos cada 3 minutos.'
      parameters: []
      responses:
        '201':
          description: Sesión iniciada
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/session"
        '401':
          description: Credenciales incorrectas o usuario sin acceso al portal
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/login_request"
  "/logout":
    delete:
      summary: Cerrar sesión
      tags:
      - Sesión
      description: Invalida el token actual.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer <token>
        schema:
          type: string
      responses:
        '401':
          description: Token inválido o ausente
        '204':
          description: Sesión cerrada
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Token obtenido con POST /login
  schemas:
    error:
      type: object
      required:
      - error
      additionalProperties: false
      properties:
        error:
          type: object
          required:
          - status
          - message
          additionalProperties: false
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: Recurso no encontrado.
            details:
              type: array
              items:
                type: string
              example:
              - Monto debe ser mayor que 0
    login_request:
      type: object
      required:
      - email_address
      - password
      properties:
        email_address:
          type: string
          format: email
          example: portal@acme.com.ar
        password:
          type: string
          format: password
          example: password
    session:
      type: object
      required:
      - token
      - token_type
      - user
      - client
      additionalProperties: false
      properties:
        token:
          type: string
          example: Xk2fP9qL7wR4tY1uZ8vB3nM6
        token_type:
          type: string
          enum:
          - Bearer
        user:
          type: object
          required:
          - id
          - name
          - email_address
          additionalProperties: false
          properties:
            id:
              type: integer
            name:
              type: string
            email_address:
              type: string
              format: email
        client:
          type: object
          required:
          - id
          - business_name
          additionalProperties: false
          properties:
            id:
              type: integer
            business_name:
              type: string
    project:
      type: object
      required:
      - id
      - name
      - description
      - status
      - started_on
      - closed_on
      - current_budget
      additionalProperties: false
      properties:
        id:
          type: integer
        name:
          type: string
          example: Sitio web Acme
        description:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - survey
          - in_progress
          - delivered
          - closed
        started_on:
          type: string
          format: date
          nullable: true
        closed_on:
          type: string
          format: date
          nullable: true
        current_budget:
          description: Última versión enviada al cliente (los borradores no se muestran)
          type: object
          nullable: true
          required:
          - id
          - version
          - status
          - total
          - pending_approval
          additionalProperties: false
          properties:
            id:
              type: integer
            version:
              type: integer
            status:
              type: string
              enum:
              - draft
              - sent
              - approved
              - rejected
            total:
              type: string
              pattern: "^-?\\d+\\.\\d{2}$"
              example: '380000.00'
            pending_approval:
              type: boolean
              description: true si espera la decisión del cliente
    project_detail:
      type: object
      required:
      - id
      - name
      - description
      - status
      - started_on
      - closed_on
      - current_budget
      - budgets
      additionalProperties: false
      properties:
        id:
          type: integer
        name:
          type: string
          example: Sitio web Acme
        description:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - survey
          - in_progress
          - delivered
          - closed
        started_on:
          type: string
          format: date
          nullable: true
        closed_on:
          type: string
          format: date
          nullable: true
        current_budget:
          description: Última versión enviada al cliente (los borradores no se muestran)
          type: object
          nullable: true
          required:
          - id
          - version
          - status
          - total
          - pending_approval
          additionalProperties: false
          properties:
            id:
              type: integer
            version:
              type: integer
            status:
              type: string
              enum:
              - draft
              - sent
              - approved
              - rejected
            total:
              type: string
              pattern: "^-?\\d+\\.\\d{2}$"
              example: '380000.00'
            pending_approval:
              type: boolean
              description: true si espera la decisión del cliente
        budgets:
          type: array
          items:
            type: object
            required:
            - id
            - version
            - status
            - total
            additionalProperties: false
            properties:
              id:
                type: integer
              version:
                type: integer
              status:
                type: string
                enum:
                - draft
                - sent
                - approved
                - rejected
              total:
                type: string
                pattern: "^-?\\d+\\.\\d{2}$"
                example: '380000.00'
    budget:
      type: object
      description: 'Solo lo facturable: sin tarifas, costos internos ni horas cargadas
        por el equipo'
      required:
      - id
      - version
      - status
      - sent_at
      - approved_at
      - notes
      - total
      - signed_document_url
      - project
      - estimated_hours
      - modules
      additionalProperties: false
      properties:
        id:
          type: integer
        version:
          type: integer
        status:
          type: string
          enum:
          - draft
          - sent
          - approved
          - rejected
        sent_at:
          type: string
          format: date-time
          nullable: true
        approved_at:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
          nullable: true
        total:
          type: string
          pattern: "^-?\\d+\\.\\d{2}$"
          example: '380000.00'
        signed_document_url:
          type: string
          format: uri
          nullable: true
        project:
          type: object
          required:
          - id
          - name
          additionalProperties: false
          properties:
            id:
              type: integer
            name:
              type: string
        estimated_hours:
          type: string
          pattern: "^-?\\d+\\.\\d{2}$"
          example: '40.00'
        modules:
          type: array
          items:
            type: object
            required:
            - name
            - items
            additionalProperties: false
            properties:
              name:
                type: string
                example: General
              items:
                type: array
                items:
                  type: object
                  required:
                  - description
                  - estimated_hours
                  additionalProperties: false
                  properties:
                    description:
                      type: string
                    estimated_hours:
                      type: string
                      pattern: "^-?\\d+\\.\\d{2}$"
                      example: '8.00'
    charge:
      type: object
      description: Cuota mensual de mantenimiento
      required:
      - id
      - period
      - due_on
      - status
      - amount
      - paid_amount
      - balance
      - days_overdue
      additionalProperties: false
      properties:
        id:
          type: integer
        period:
          type: string
          pattern: "^\\d{4}-\\d{2}$"
          example: 2026-08
        due_on:
          type: string
          format: date
        status:
          type: string
          enum:
          - pending
          - partial
          - paid
          - overdue
        amount:
          type: string
          pattern: "^-?\\d+\\.\\d{2}$"
          example: '380000.00'
        paid_amount:
          type: string
          pattern: "^-?\\d+\\.\\d{2}$"
          example: '380000.00'
        balance:
          type: string
          pattern: "^-?\\d+\\.\\d{2}$"
          example: '380000.00'
        days_overdue:
          type: integer
          minimum: 0
    payment:
      type: object
      required:
      - id
      - paid_on
      - payment_method
      - status
      - notes
      - created_at
      - amount
      - receipt
      additionalProperties: false
      properties:
        id:
          type: integer
        paid_on:
          type: string
          format: date
        payment_method:
          type: string
          enum:
          - transfer
          - cash
          - check
        status:
          type: string
          enum:
          - pending_review
          - confirmed
          - rejected
          description: Un pago informado queda en pending_review hasta que un admin
            lo confirma
        notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        amount:
          type: string
          pattern: "^-?\\d+\\.\\d{2}$"
          example: '380000.00'
        receipt:
          type: object
          nullable: true
          required:
          - filename
          - content_type
          - byte_size
          - url
          additionalProperties: false
          properties:
            filename:
              type: string
              example: comprobante.pdf
            content_type:
              type: string
              enum:
              - application/pdf
              - image/jpeg
              - image/png
            byte_size:
              type: integer
            url:
              type: string
              format: uri
    account:
      type: object
      required:
      - client
      - debt
      - overdue_charges
      - unpaid_charges
      - recent_payments
      additionalProperties: false
      properties:
        client:
          type: object
          required:
          - id
          - business_name
          - tax_id
          additionalProperties: false
          properties:
            id:
              type: integer
            business_name:
              type: string
            tax_id:
              type: string
              nullable: true
        debt:
          type: string
          pattern: "^-?\\d+\\.\\d{2}$"
          example: '380000.00'
          description: Saldo pendiente de las cuotas impagas
        overdue_charges:
          type: integer
          description: Cantidad de cuotas vencidas
        unpaid_charges:
          type: array
          items:
            "$ref": "#/components/schemas/charge"
        recent_payments:
          type: array
          maxItems: 5
          items:
            "$ref": "#/components/schemas/payment"
    payment_request:
      type: object
      required:
      - amount
      - paid_on
      - payment_method
      properties:
        amount:
          type: string
          example: '100000'
        paid_on:
          type: string
          format: date
          example: '2026-09-10'
        payment_method:
          type: string
          enum:
          - transfer
          - cash
          - check
        notes:
          type: string
        receipt:
          type: string
          format: binary
          description: 'Solo en multipart/form-data: PDF, JPG o PNG de hasta 5 MB'
